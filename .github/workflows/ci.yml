name: CI

# Type-checks and builds every PR and every push to main. Deploys are done by Cloudflare
# Workers Builds (it builds `main` and runs `wrangler deploy`), not by GitHub Actions.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUBLIC_COMPANY_NAME: Arnav Mehta / devnull03
      PUBLIC_DOMAIN: dvnl.work
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
