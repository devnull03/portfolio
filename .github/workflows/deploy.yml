name: Deploy

# Builds the whole site from scratch and deploys it to Cloudflare Workers.
#
# Runs when:
#   - a `v*` or `content-*` tag is pushed (a normal release: `git tag v1.2.0 && git push --tags`)
#   - content-release.yml calls it after the LinkedIn sync worker reports a profile change
#   - it is started by hand from the Actions tab
#
# Pages are prerendered, so the LinkedIn fetch below is the only time LinkedIn is contacted.
on:
  push:
    tags: ['v*', 'content-*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or SHA to deploy
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

# Never cancel a deploy halfway; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dvnl.work
    env:
      PUBLIC_COMPANY_NAME: ${{ vars.PUBLIC_COMPANY_NAME || 'Arnav Mehta / devnull03' }}
      PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN || 'dvnl.work' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No-op (keeps the committed content/linkedin.json) when none of these are configured.
      - name: Fetch LinkedIn data
        run: pnpm content:fetch
        env:
          LINKEDIN_DMA_TOKEN: ${{ secrets.LINKEDIN_DMA_TOKEN }}
          LINKEDIN_EXPORT: ${{ vars.LINKEDIN_EXPORT_URL }}
          LINKEDIN_EXPORT_TOKEN: ${{ secrets.LINKEDIN_EXPORT_TOKEN }}

      # Keep exactly what was deployed, since a fetched snapshot isn't committed back.
      - uses: actions/upload-artifact@v4
        with:
          name: content-${{ github.run_id }}
          path: content/

      - run: pnpm build

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --message "${{ inputs.ref || github.ref_name }} (${{ github.sha }})"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
